<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e6091">
<title>لوحة التحكم</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",Arial,sans-serif;
    background:linear-gradient(150deg,#eef4f2 0%,#f1f5f9 50%,#e0f0f9 100%);
    color:#0f172a;
    display:flex;align-items:center;justify-content:center;
    padding:22px;
  }
  .wrap{width:100%;max-width:420px;}
  .brand{
    text-align:center;margin-bottom:28px;
  }
  .brand h1{
    margin:0;font-size:1.55rem;font-weight:800;letter-spacing:.3px;
    color:#17302b;
  }
  .brand p{
    margin:8px 0 0;font-size:.94rem;color:#64748b;font-weight:700;
  }
  .choices{
    display:flex;flex-direction:column;gap:16px;
  }
  .choice{
    display:flex;align-items:center;gap:16px;
    padding:22px 20px;border-radius:22px;
    border:none;cursor:pointer;
    font-family:inherit;text-align:right;
    box-shadow:0 6px 22px rgba(15,23,42,.12);
    transition:transform .15s, box-shadow .2s;
    position:relative;overflow:hidden;
  }
  .choice:active{transform:scale(.98);}
  .choice:hover{box-shadow:0 10px 28px rgba(15,23,42,.16);}
  .choice.nursery{
    background:linear-gradient(135deg,#1f7a6b,#37b39a);
    color:#fff;
  }
  .choice.building{
    background:linear-gradient(135deg,#1e6091,#2d8fbf);
    color:#fff;
  }
  .choice .icon{
    flex-shrink:0;
    width:64px;height:64px;border-radius:50%;
    background:rgba(255,255,255,.22);
    border:1.5px solid rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;line-height:1;
  }
  .choice .info{flex:1;min-width:0;}
  .choice .title{
    font-size:1.25rem;font-weight:800;letter-spacing:.2px;
    margin:0 0 4px;
  }
  .choice .desc{
    font-size:.84rem;font-weight:600;
    opacity:.9;line-height:1.45;
  }
  .choice .arrow{
    flex-shrink:0;font-size:1.4rem;opacity:.7;
  }
  .footer{
    text-align:center;margin-top:26px;
    font-size:.78rem;color:#94a3b8;font-weight:700;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <h1>👋 أهلاً بكِ</h1>
    <p>اختاري النظام الذي تريدين إدارته</p>
  </div>

  <div class="choices">

    <button class="choice nursery" type="button" onclick="location.href='babycare.html'">
      <div class="icon">👼</div>
      <div class="info">
        <div class="title">حضانة بيبي كير</div>
        <div class="desc">متابعة دفعات الأطفال والملاحظات</div>
      </div>
      <div class="arrow">‹</div>
    </button>

    <button class="choice building" type="button" onclick="location.href='building.html'">
      <div class="icon">🏢</div>
      <div class="info">
        <div class="title">إدارة الإيجارات</div>
        <div class="desc">متابعة دفعات الشقق والمحلات</div>
      </div>
      <div class="arrow">‹</div>
    </button>

  </div>

  <div class="footer">قاعدة بيانات موحّدة — Firebase</div>

</div>

</body>
</html>
